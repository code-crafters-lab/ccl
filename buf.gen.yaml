version: v2
# 请勿轻言使用，输出目录含义其他代码也会被删除
clean: true
managed:
  enabled: true
plugins:
  - local: [ "go", "run", "./internal/protoc/protoc-gen-dict/main.go" ]
    out: .artifacts/grpc
    opt:
      - paths=source_relative
      - java_enum_package=net.jqsoft.cds.bid.enums
      - out_type=md|sql
  - remote: buf.build/protocolbuffers/go:v1.36.9
    out: .artifacts/grpc
    opt:
      - module=github.com/code-crafters-lab/ccl/pkg/grpc
  - remote: buf.build/connectrpc/go:v1.19.0
    out: .artifacts/grpc
    opt:
      - module=github.com/code-crafters-lab/ccl/pkg/grpc
#      - package_suffix= # 去掉默认 package suffix
      - simple # 简化模式
  - remote: buf.build/grpc/go:v1.5.1
    out: .artifacts/grpc
    opt:
      - module=github.com/code-crafters-lab/ccl/pkg/grpc
#  - remote: buf.build/grpc-ecosystem/gateway:v2.27.2
#    out: .artifacts/grpc
#    opt:
#      - module=github.com/code-crafters-lab/ccl/pkg/grpc
inputs:
  - directory: proto
    exclude_paths:
      - proto/extension
      - proto/license
      - proto/jqsoft