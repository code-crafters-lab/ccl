edition = "2023";

package ccl;

import "buf/validate/validate.proto";

option go_package = "github.com/code-crafters-lab/ccl/pkg/grpc";

message Pagination {
    // 当前页数
    uint32 number = 1 [(buf.validate.field).uint32.gte = 1];
    // 每页条数
    uint32 size = 2 [(buf.validate.field).uint32.gte = 1];
}

