edition = "2023";

package ccl;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/code-crafters-lab/ccl/pkg/extension";

extend google.protobuf.FileOptions {
    bool dict_enable = 1001 [default = false];
}

message DictExtensionMetadata {
    reserved code;
    reserved 1;

    string name = 2;
    string description = 3;
    string replace_with = 4;
}

extend google.protobuf.EnumOptions {
    DictExtensionMetadata dict = 1001;
}

extend google.protobuf.EnumValueOptions {
    DictExtensionMetadata item = 1001;
}










