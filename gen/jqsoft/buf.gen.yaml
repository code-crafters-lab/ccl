version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: java_package_prefix
      value: net
    - file_option: java_package
      path: jqsoft/bid/bid.proto
      value: net.jqsoft.cds.bid
    - file_option: java_package
      path: jqsoft/task/log.proto
      value: net.jqsoft.cds.task
plugins:
  - local: [ "go", "run", "../../internal/protoc/protoc-gen-dict" ]
    out: .out
    opt:
      - paths=source_relative
      - out_type=md|sql|java
#  - remote: buf.build/protocolbuffers/java:v33.0
#    out: .java
inputs:
  - directory: ../../proto
    exclude_paths:
      - ../../proto/extension
      - ../../proto/license
      - ../../proto/ccl